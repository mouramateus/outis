# Modo anônimo: celular (Outline) -> Mac -> Tor -> ProtonVPN (OpenVPN TCP) -> internet.
# O Proton vê um nó de saída do Tor, nunca o IP de casa. Uso: ./vpn up <país>
name: vpn-pais

services:
  tor:
    build: ./tor
    image: vpn-pais-tor:local
    container_name: vpn-pais-tor
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Estado do Tor persistente: mantém os mesmos nós de entrada entre conexões (menos exposição).
      - tor-data:/var/lib/tor
    networks:
      default:
        ipv4_address: 172.31.251.2
    restart: "no"

  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: vpn-pais
    depends_on: [tor]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    security_opt: ["no-new-privileges:true"]
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: /gluetun/custom.ovpn
      # Segredos por arquivo: não aparecem no `docker inspect`.
      OPENVPN_USER_SECRETFILE: /run/secrets/openvpn_user
      OPENVPN_PASSWORD_SECRETFILE: /run/secrets/openvpn_password
      SHADOWSOCKS: "on"
      SHADOWSOCKS_LISTENING_ADDRESS: ":8388"
      SHADOWSOCKS_CIPHER: chacha20-ietf-poly1305
      SHADOWSOCKS_PASSWORD_SECRETFILE: /run/secrets/shadowsocks_password
      DNS_UPSTREAM_IPV6: "off"
      BLOCK_MALICIOUS: "on"
      PUBLICIP_ENABLED: "off"
      VERSION_INFORMATION: "off"
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
      TZ: America/Sao_Paulo
    secrets: [openvpn_user, openvpn_password, shadowsocks_password]
    volumes:
      - "${VPN_DATA:?use ./vpn}/secrets/run/active.ovpn:/gluetun/custom.ovpn:ro"
      - ./config/gluetun-auth.toml:/gluetun/auth/config.toml:ro
    networks:
      default:
        ipv4_address: 172.31.251.3
    ports:
      # Só no IP do Mac na rede atual (o ./vpn preenche); ao trocar de rede, o vigia desliga tudo.
      - "${SS_BIND:?use ./vpn up}:${SS_PORT:-8388}:8388/tcp"
      - "${SS_BIND:?use ./vpn up}:${SS_PORT:-8388}:8388/udp"
    restart: "no"

secrets:
  openvpn_user:
    environment: OPENVPN_USER
  openvpn_password:
    environment: OPENVPN_PASSWORD
  shadowsocks_password:
    environment: SS_PASSWORD

volumes:
  tor-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.251.0/28
